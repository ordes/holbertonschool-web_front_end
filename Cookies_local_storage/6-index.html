<!DOCTYPE html>
<html>

<head>
	<title>Shopping Cart with Session Storage</title>
</head>

<body>
	<h1>Shopping Cart with Session Storage</h1>
	<div id="cart-message"></div>
	<div id="store-container"></div>

	<script>
		const availableItems = ["Shampoo", "Soap", "Sponge", "Water"];

		if (typeof (sessionStorage) === "undefined") {
			alert("Sorry, your browser does not support Web storage. Try again with a better one");
		} else {
			createStore();
			displayCart();
		}

		function addItemToCart(item) {
			sessionStorage.setItem(item, "true");
			displayCart();
		}

		function createStore() {
			const ul = document.createElement("ul");

			for (let i = 0; i < availableItems.length; i++) {
				const li = document.createElement("li");
				li.textContent = availableItems[i];

				li.addEventListener("click", function () {
					addItemToCart(availableItems[i]);
				});

				ul.appendChild(li);
			}

			document.getElementById("store-container").appendChild(ul);
		}

		function displayCart() {
			let itemCount = 0;

			for (let i = 0; i < sessionStorage.length; i++) {
				const key = sessionStorage.key(i);
				if (availableItems.includes(key)) {
					itemCount++;
				}
			}

			if (itemCount > 0) {
				const messageDiv = document.getElementById("cart-message");
				messageDiv.innerHTML = `You previously had ${itemCount} items in your cart`;
			} else {
				document.getElementById("cart-message").innerHTML = "";
			}
		}
	</script>
</body>

</html>
